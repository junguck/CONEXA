packages:
  - apps/*
  - services/*
  - services/_runtimes/*
  - packages/*

# Versions épinglées dans les manifestes (le lockfile fait foi).
saveExact: true
engineStrict: true

# Scripts d'installation autorisés (pnpm 12 bloque les build scripts par défaut).
allowBuilds:
  lefthook: true
  # Next s’appuie sur sharp (binaires précompilés) pour l’optimisation d’images.
  sharp: true
