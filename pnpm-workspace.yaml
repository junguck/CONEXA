packages:
  - apps/*
  - services/*
  - services/_runtimes/*
  - packages/*

# Versions épinglées dans les manifestes (le lockfile fait foi).
saveExact: true
engineStrict: true

# Dépendance transitive épingle exactement à 2.4.0 par @nestjs/platform-express :
# GHSA-q7qp-rjg7-q26m (high, DoS) est corrigé à partir de 2.5.0, et l'étape
# « Audit des dépendances » de la CI exige cette version.
overrides:
  multer: '>=2.5.0'

# Scripts d'installation autorisés (pnpm 12 bloque les build scripts par défaut).
allowBuilds:
  lefthook: true
  # Next s’appuie sur sharp (binaires précompilés) pour l’optimisation d’images.
  sharp: true
