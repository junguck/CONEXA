# Infrastructure de développement Convexa (F0.2).
#
#   pnpm dev:infra     démarre tout et attend que ce soit sain
#   pnpm dev:down      arrête sans supprimer les volumes
#   pnpm dev:reset     supprime les volumes et repart d'une base vide
#
# Un service = un domaine = un schéma PostgreSQL, avec un rôle dédié.
# Aucune donnée hors des volumes nommés ; aucun secret réel dans ce fichier.
#
# `docker compose -f deploy/compose.dev.yaml up -d` (commandes v1) démarre le
# socle : PostgreSQL, Redis, RabbitMQ. MinIO et le collecteur OTel sont derrière
# les profils `storage` et `observability`, activés par `pnpm dev:infra`.
name: conexa-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: conexa-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conexa_dev}
      POSTGRES_DB: ${POSTGRES_DB:-conexa}
      # Mot de passe des rôles de service, créés par le script d'initialisation.
      CONEXA_DEV_DB_PASSWORD: ${CONEXA_DEV_DB_PASSWORD:-conexa_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: conexa-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: conexa-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-conexa}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-conexa_dev}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  minio:
    profiles: [storage]
    image: minio/minio:latest
    container_name: conexa-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-conexa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-conexa_dev}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: conexa-otel-collector
    command: ['--config=/etc/otel-collector.yaml']
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - '${OTEL_GRPC_PORT:-4317}:4317'
      - '${OTEL_HTTP_PORT:-4318}:4318'
      - '${OTEL_HEALTH_PORT:-13133}:13133'
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
