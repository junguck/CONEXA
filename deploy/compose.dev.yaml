# Infrastructure de développement Convexa.
#   docker compose -f deploy/compose.dev.yaml up -d
# Profil « pgvector » chaque service déploie son propre schéma ; aucun accès croisé.
name: conexa-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: conexa-postgres
    environment:
      POSTGRES_USER: conexa
      POSTGRES_PASSWORD: conexa_dev
      POSTGRES_DB: conexa
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U conexa -d conexa']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: conexa-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: conexa-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: conexa
      RABBITMQ_DEFAULT_PASS: conexa_dev
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
