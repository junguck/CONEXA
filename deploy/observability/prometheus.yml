# Prometheus de développement (F0.6).
# Les métriques applicatives arrivent par le collecteur OTel (:8889) et par
# le générateur de métriques de Tempo (span metrics + service graph, remote
# write). Les files viennent de rabbitmq-exporter.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq-exporter:9419']
