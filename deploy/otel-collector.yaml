# Collecteur OpenTelemetry du profil de développement (F0.2).
# Les services exportent en OTLP vers localhost:4317 (gRPC) ou :4318 (HTTP).
# Ici les traces et métriques sont écrites en clair dans les journaux du
# conteneur : le tableau de bord arrive avec F0.6.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
